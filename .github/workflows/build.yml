name: Build SAFRESH Customer Feedback APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack SAFRESH source project
        run: |
          unzip -q SAFRESH_CUSTOMER_FEEDBACK_SOURCE.zip
          echo "PROJECT_DIR=SAFRESH_CUSTOMER_FEEDBACK" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: SAFRESH_CUSTOMER_FEEDBACK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAFRESH-CUSTOMER-FEEDBACK-APK
          path: SAFRESH_CUSTOMER_FEEDBACK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
